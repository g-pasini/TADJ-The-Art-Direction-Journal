name: Edição diária

on:
  schedule:
    - cron: "0 8 * * *"   # 08:00 UTC = 05:00 em Brasília
  workflow_dispatch:       # botão "Run workflow" para gerar na hora

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: edicao
  cancel-in-progress: false

jobs:
  gerar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main          # sempre a versão mais nova, mesmo ao reexecutar
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Gerar edição (sem IA, 0 tokens)
        run: python gerar.py
      - name: Guardar edição e histórico no repositório
        run: |
          git config user.name "tadj-bot"
          git config user.email "actions@users.noreply.github.com"
          git add site dados
          git commit -m "Edição $(date -u +%F)" || echo "Nada novo"
          git pull --rebase -X theirs origin main
          git push origin HEAD:main
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - uses: actions/deploy-pages@v4
